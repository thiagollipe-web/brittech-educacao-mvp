<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-label="Brittech Educação — logotipo">
  <defs>
    <linearGradient id="quadro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#0A2540"/>
    </linearGradient>
  </defs>
  <!-- Símbolo original: livro aberto cujas páginas formam um "B", com um circuito/centelha de IA -->
  <g>
    <rect x="8" y="28" width="144" height="144" rx="22" fill="url(#quadro)"/>
    <!-- livro aberto -->
    <path d="M80 62 C64 50 44 50 34 56 L34 128 C44 122 64 122 80 134 C96 122 116 122 126 128 L126 56 C116 50 96 50 80 62 Z" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    <line x1="80" y1="62" x2="80" y2="134" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <!-- linhas de texto nas páginas -->
    <line x1="42" y1="76" x2="70" y2="76" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <line x1="42" y1="92" x2="70" y2="92" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <line x1="90" y1="76" x2="118" y2="76" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <line x1="90" y1="92" x2="118" y2="92" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <!-- centelha de IA -->
    <circle cx="126" cy="140" r="12" fill="#84CC16"/>
    <path d="M126 132 L128.5 139 L136 139 L129.5 143.5 L131.5 150 L126 145.5 L120.5 150 L122.5 143.5 L116 139 L123.5 139 Z" fill="#0A2540"/>
  </g>
  <!-- Wordmark -->
  <text x="180" y="98" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#0A2540">Brittech</text>
  <text x="182" y="142" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="6" fill="#0284C7">EDUCAÇÃO</text>
</svg>
